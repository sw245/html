<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin:0; padding:0;}
        h4{text-align:center;}
        img{width:400px;}
        .shape{width:300px; height:200px; border:1px solid black; margin:50px auto;
                background:green;
                transition-property: width,height;
                transition-duration: 3s,1s;
                transition-timing-function:ease-in;
                transition-delay:1s
            }
        .shape:hover{ width:500px; height:400px; }

        .shape2{width:400px; height:300px; border:1px solid black; margin:50px auto;
                background:green;
                
                overflow:hidden;
            }
        .shape2 img{ width:400px;
            /* property, duration, delay, timing-function 순 */
            transition: all 1s 0s ease-out;
            /*
            transition-property: all;
            transition-duration: 1s;
            transition-timing-function:ease-out;
            transition-delay:0; */
        }

        .shape2 img:hover{ transform:scale(1.3);
            transform: rotate(360deg)};
            /* translate은 하나의 효과만 적용 가능 */
            /* */


        /*@keyframes shape4{
            from{transform 
            to{transform }
        }*/

    </style>
</head>
<body>
    <div>
        <h4>뒷배경1</h4>
        <div class="shape">

        </div>
        <h4>김지원</h4>
        <div class="shape2">
            
            <img src="images/kim.jpg">
        </div>
    </div>
</body>
</html>
