<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin:0; padding:0}
        div{width:2000px; height:3000px; border:5px solid black;}
        span{
            display:inline-block; width:200px; height:100px;
            text-align:center; font-size:30px;
            border:1px solid black; line-height:100px;
        }
        
        #txt1{
            position:fixed; left:0px; top:0px;
        }
        #txt2{
            position:fixed; left:210px; top:0px;
        }
        
    </style>
</head>
<body>
    <!-- <button id="btn">버튼</button> -->
    <div>
        <span id="txt1">0</span>
        <span id="txt2">0</span>
    </div>
    <script>
        //scrollY : 스크롤의 높이(y좌표) / scrollX : 스크롤의 길이(x좌표)
        window.addEventListener("scroll",(event)=>{
            this.scrollY;
            document.querySelector("#txt1").innerText = this.scrollY;
            this.scrollX;
            document.querySelector("#txt2").innerText = this.scrollX;
        });

        //  function() : 익명 함수 / 콜백 함수
        window.addEventListener("scroll",function(){

        });
        
        //화살표 함수선언 
        const sBtn = () => {
            alert("=> => =>");
        }
        
        document.querySelector("#btn").onclick = sBtn;

        /*
        // 함수 선언 (윈도우 객체에서 권장)
        function sBtn(){
            alert("ㄴㅇㄴㄴㅁㄴㅇ")
        }
        */

    </script>
</body>
</html>
