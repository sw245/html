    //jQuery 선언
    
    $(function(){
        // 클릭 명령어 - click, dbclick // change, scroll, focusin, focusout 등의 명령어가 있음
        $("#cbtn").click(function(){
            let kor = Number($("#kor").val());
            let eng = Number($(".eng").val());
            $("#d01").text(kor+eng);        // html 글자 변경
            $("#d01").css("color","red");   // css 속성변경
            $("#d01").css("font-size","30px")
            $("#d01").css("border","2px solid green")


        });

        // 이미지 변경

        $("#chgImg").click(function(){
            $("#img").attr('src','images/best02.jpg');
        });
    });

</script>
<body>
    <label>국어</label>
    <input type="text" id="kor" value="10"><br>
    <label>영어</label>
    <input type="text" class="eng" value="20"><br>

    <div id="d01">0</div>
    <img id="img" src="images/best01.jpg"><br>
