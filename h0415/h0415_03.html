<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COOKIT</title>
    <style>
        /* generals */
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic&family=Noto+Sans+KR:wght@100..900&family=Single+Day&display=swap');
        *{
            padding:0; margin:0;
            font-family: "Noto Sans KR", sans-serif;
            font-optical-sizing: auto;
            font-style: normal;
        }
        ul,ol{list-style:none;}

        /* header-top */
        #header-top{
            width:100%; height:35px;
            background:#202020; display:flex; justify-content: flex-end;
        }

        #header-top ul{
            display:flex; width:400px; height:35px;
            box-sizing:border-box; justify-content: space-between;
            align-items: center; margin-right:40px;
            color:white; font-size:13px;
        }

        /* navigation */
        #navi{
            width:1840px; height:81px; border:1px solid black; margin:0 auto;
            display:flex; justify-content: space-between; align-items: center;
        }

        #logo a{
            width:100px; height:30px; border:1px solid black; display:inline-block;
            background:url('images/ico_set.png') -320px -385px no-repeat;
            background-size:800px 800px;
        }

        #menu ul{
            width:700px; height:81px; border:1px solid black;
            display:flex; justify-content: space-between; align-items: center;
        }
        
        #quick{
            width:103px; height:49px; border:1px solid black; 
            display:flex; justify-content: space-between;
        }

        #quick li{
            font-size:12px;
        }

        #q_img1{
            width:32px; height:32px; display:block;
            background:url('images/ico_set.png') -584px -320px no-repeat;
            background-size:800px 800px;
        }

        #q_img2{
            width:32px; height:32px; display:block;
            background:url('images/ico_set.png') -628px -320px no-repeat;
            background-size:800px 800px;
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <div id="header-top">
                <ul>
                    <li>회원가입</li>
                    <li>로그인</li>
                    <li>고객행복센터</li>
                    <li>배송지역검색</li>
                    <li>기프트카드 등록</li>
                </ul>
            </div>
            <div id="navi">
                <span id="logo">
                    <a href="#"></a>
                </span>
                <span id="menu">
                    <ul>
                        <li>COOKIT소개</li>
                        <li>COOKIT메뉴</li>
                        <li>리뷰</li>
                        <li>이벤트</li>
                        <li>MY쿡킷</li>
                    </ul>
                </span>
                <span id="quick">
                    <ul>
                        <a href="#" id="q_img1"></a>
                        <li>장바구니</li>  
                    </ul>
                    <ul>
                        <a href="#" id="q_img2"></a>
                        <li>메뉴찾기</li>  
                    </ul>
                </span>                
            </div>
        </nav>
    </header>

</body>
</html>
