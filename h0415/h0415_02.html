<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 기본 페이지 설정 */
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic&family=Noto+Sans+KR:wght@100..900&family=Single+Day&display=swap');
        *{
            margin:0; padding:0;
            font-family: "Noto Sans KR", sans-serif;
            font-optical-sizing: auto;
            font-style: normal;
        }
        a{text-decoration:none; color:inherit;}
        ul,ol{list-style:none;}

        /* 헤더 탑 */
        #header-top{
            width:100%; height:35px; background:#202020;
            display:flex; justify-content: flex-end;
        }
        #header-top ul{
            width:400px; height:35px; line-height:33px;
            display:flex; justify-content: space-between; margin-right:40px;
            color:white; font-size:13px;
        }
        
        /* 내비게이션 */
        nav{width:100%; height:81px; border-bottom:1px solid black;}
        #nav_nav{
            width:1840px; height:81px; align-items: center;
            margin:0 auto; display:flex; justify-content: space-between;
        }
        .logo a{
            width:100px; height:30px; display: inline-block;
            background:url('images/ico_set.png') -320px -385px no-repeat; background-size:800px 800px;
        }
        .menu{
            width:700px; 
        }
        .menu ul{
            display:flex; justify-content: space-between; 
        }
        .menu a{ 
            line-height:81px; height:81px; display:inline-block;
            box-sizing: border-box;
            font-size:21px; font-weight:700; 
        }
        .menu a:hover{
            color:rgb(75,9,0);
        }
        .q_menu{
            width:103px; height:52px; 
        }
        .q_menu ul{
            display:flex; justify-content: space-around;
            font-size:12px; font-weight:600; color:#101010; letter-spacing: -0.5px;
        }
        #q_menu_img1, #q_menu_img2{
            width:32px; height:32px; margin:0 auto;
        }
        #q_menu_img1{
            background:url('images/ico_set.png') -584px -320px no-repeat;
            background-size: 800px 800px;
        }
        #q_menu_img2{
            background:url('images/ico_set.png') -628px -320px no-repeat;
            background-size: 800px 800px;
        }

        #banner{
            width:100%; height:320px;
            background:url('images/join_sub.jpg') no-repeat;
        }
    </style>
</head>
<body>
    <header>
        <div id="header-top">
            <ul>
                <li a href="#">회원가입</li>
                <li a href="#">로그인</li>
                <li a href="#">고객행복센터</li>
                <li a href="#">배송지역검색</li>
                <li a href="#">기프트카드 등록</li>
            </ul>
        </div>
        <nav>
            <div id="nav_nav">
                <div class="logo">
                    <a href="#"></a>
                </div>
                <div class="menu">
                    <ul>
                        <a href="#"><li>COOKIT소개</li></a>
                        <a href="#"><li>COOKIT메뉴</li></a>
                        <a href="#"><li>리뷰</li></a>
                        <a href="#"><li>이벤트</li></a>
                        <a href="#"><li>MY쿡킷</li></a>
                    </ul>
                </div>
                <div class="q_menu">
                    <ul>
                        <li>
                            <a href="#">
                                <div id="q_menu_img1"></div>
                                <div>장바구니</div>
                            </a>
                        </li>
                        <li>
                            <a href="#">
                                <div id="q_menu_img2"></div>
                                <div>메뉴찾기</div>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <div id="banner">

    </div>
</body>
</html>
