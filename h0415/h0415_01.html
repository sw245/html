<!doctype html>
<html>
    <head>
        <title></title>
    </head>
    <style>
        *{margin:0; padding:0;}
        #main{width:1000px; margin:0 auto; border:1px solid black;}
        ul{ /*flex-direction: row-reverse; 오른쪽에서 왼쪽으로 배치 */
            display:flex; width:1000px; height:100px; border:5px solid green; 
            /* 주축방향 정렬 flex-start, flex-end, center, space-between, space-around, space-evenly */ 
            justify-content: space-around;
            /* 교차축방향 정렬 */
            align-items: center;
        }
        li{width:170px; height:40px; border:1px solid black; list-style:none;}
    </style>
    <body>
        <div id="main">
            <h2>메뉴</h2>
            <ul>
                <li>1</li>
                <li>2</li>
                <li>3</li>
                <li>4</li>
                <li>5</li>
            </ul>
        </div>
    </body>
</html>
