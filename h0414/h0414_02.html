<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>회원가입</h2>
    <form action="main.html" method="post"> <!-- action >> 데이터 보내는 곳? -->
        <label>아이디</label>
        <input type="text" name="id" value="admin"><br> <!-- value: 미리 값 출력 -->

        <label>성별</label><br>
        <label for="male">남성</label><input type="radio" name="gender" id="male" value="male">
        <label for="female">여성</label><input type="radio" name="gender" id="female" value="female"><br>
        <!-- label for=""와 id="" 가 대응됨 (라벨을 클릭해도 선택됨)-->
        <br>
        <label>상담여부</label><br>
        <label for="yes">예</label><input type="radio" name="counsel" id="yes" value="yes"> <!-- name 변수명 value값이 전송됨 (문자열 형식으로 전송)-->
        <label for="no">아니오</label><input type="radio" name="counsel" id="no" value="no"><br> <!-- name이 같으면 같은 분류 취급 / radio:같은 분류 내 택1-->
        <br>
        <label>취미</label><br>
        <label for="golf">골프</label><input type="checkbox" name="hobby" id="golf" value="golf"> <!-- checkbox: 다수 선택 (리스트 형태로 넘어감) -->
        <label>수영</label><input type="checkbox" name="hobby" value="swimming">
        <label>조깅</label><input type="checkbox" name="hobby" value="jogging">
        <label>체스</label><input type="checkbox" name="hobby" value="chess">
        <br>

        <input type="submit" value=" 가입완료">
        <input type="reset" value="취소">
    </form>
</body>
</html>
