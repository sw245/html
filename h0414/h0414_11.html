<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin:0; padding:0;}
        div{
            width:700px; height:500px; border:20px dotted green; font-size:30px;
            background-color:pink;
            background-size: 100%; background-repeat:no-repeat;
            background-clip: padding-box;
            /* border-box: 선 바깥부분 기준, padding-box 선 안쪽부분 기준, content-box: padding 안쪽부분 기준*/
            padding:30px;
            box-sizing: border-box;
        }
        div img{width:100%}
        #container{
            width:100%; height:900px; background-image:url('images/back1.jpg');
            background-size: 200px; background-repeat: repeat;
            background-clip:border-box
        }
    </style>
</head>
<body>
    <div>
        <!-- <img src="images/nurture jacket.jpg"> -->
    </div>
    <div id="container">
        
    </div>
</body>
</html>
