<!doctype html>
<html>
    <head>
        <title>table</title>
        <style>
            *{margin:0; padding:0;}
            table,td{
                width:600px;
                height:200px;
                border:1px solid black;
                border-collapse:collapse;
                text-align:center; vertical-align:bottom;
                /*border-spacing:20px; 여백  */
            }

        </style>
    </head>
    <body>

        <table>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
        </table>
        
    </body>
</html>
