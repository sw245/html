<!doctype html>
<html>
    <head>
        <title>title</title>
        <style>
            *{margin:0; padding:0; font-size:20px;}
            div{width:100px;height:100px;
                border:2px solid black;
            }
            #container{
                width:800px; height:3000px; border:5px solid green;
                margin:50px auto;
            }
            .c0{ }
            .c1{ position:relative; left:600px; top:100px; }
            .c2{ position:absolute; left:100px; top:700px; }
            .c3{ position:relative; left:400px;  }
            .c4{ position:fixed; right:0; top:400px; }
        </style>
    </head>
    <body>
        <h2 id="first">위치소개</h2>
        <div id="container">
            <div class="c0">0</div>
            <div class="c1">1</div>
            <div class="c2">2</div>
            <div class="c3">3</div>
            <a href="#first"><div class="c4">top↑</div></a>
        </div>
    </body>
</html>
