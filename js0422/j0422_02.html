        function cbtn(){
            // alert("이벤트 당첨");
            // 남자, 25세 이상이면 당첨................ㅎ믐
            let gender = document.querySelector("#gender").value;
            let age = Number(document.querySelector("#age").value);
            if (gender=="남성" && age>=25){
                alert("당첨입니다.")
            }else{
                alert("당첨되지 않았습니다.")
            }
        }//cbtn

        function checkBtn(){
            let age = Number(document.querySelector("#age").value);
            var  resultTxt = age<25?"이벤트 신청 불가":"이벤트 신청가능"    // 삼항식 ??
            document.querySelector("#txt").style.color = "red";
            document.querySelector("#txt").innerText = resultTxt;
        }//checkBtn
    
    </script>

<body>
    <h2>회원가입</h2>
    <label>나이</label>
    <input type="text" name="age" id="age" on><br>
    <span id="txt">나이를 정확히 입력하세요.</span><br>
    <label>성별</label>
    <input type="text" name="gender" id="gender" onfocus="checkBtn()"><br>
    <button type="button" onclick="cbtn()">이벤트신청</button>
    <button type="button" onclick="cbtn2()">감소하기</button>
    <div id="cal">0</div>
</body>
