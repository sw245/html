    <style>
        table,tr,td{border:1px solid black; border-collapse:collapse;}
        th, td{width:200px; height:40px; text-align:center; }

</head>
<body>
    <table>
        <tr>
            <th>번호</th>
        </tr>
        <tbody id="tbody">
            <tr>
                <td>1</td>
            </tr>
        </tbody>
    </table>
    <script>
        let num = ""
        for(let i=1;i<=10;i++){
            num += `<tr><td>${i}</td></tr>`
        }
        document.querySelector("#tbody").innerHTML = num;
    </script>
