    <h2>랜덤숫자 정답</h2>
    <table>
        <tr>
            <th>정답</th>
            <td id="answer">0</td>
        </tr>
    </table>
    <h2>입력숫자</h2>
    <table>
        <tr>
            <th>번호</th>
            <th>입력값</th>
        </tr>

        <tr>

    <script>

        let ran_num = parseInt(Math.random()*100)+1;
        document.querySelector("#answer").innerText = ran_num;
        let in_arr = [];

        while(true){
            let in_num = prompt("1부터 100까지의 숫자 중 하나를 입력하세요.");
            if(in_num==ran_num){
                in_arr.push(in_num);
                alert("정답입니다.")
                break;
            }else if(0<in_num && in_num<=100 && in_num < ran_num){
                in_arr.push(in_num);
                alert("입력한 숫자가 작습니다.")
            }else if(0<in_num && in_num<=100 && in_num > ran_num){
                in_arr.push(in_num);
                alert("입력한 숫자가 큽니다.")
            }else{
                alert("잘못된 입력입니다.")
            }

        }
        
        let in_html = ""
        
        for(i=0;i<in_arr.length;i++){
            in_html += `<tr>`
            in_html += `<td>${i+1}</td>`
            in_html += `<td>${in_arr[i]}</td>`
            in_html += `<tr>`
        }
        
        document.querySelector("#tbody").innerHTML = in_html;
