<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <link rel="stylesheet" type="text/css"  -->
    <title>Document</title>
    <script>
        console.log("hi");
        // 콘솔창에서 에러 확인할 수 있음
        // 변수: boolean int float str / undefined, null
        let a = 1;      // 숫자: 정수형 데이터
        let b = 10.25;  // 숫자: 실수형 데이터
        let c = "안녕"; // 문자형 데이터
        let d = true;   // 논리형 데이터
        console.log("a:"+a);
        console.log("b:"+b);    // 파이썬에서는 다른 자료형의 +연산 불가했지만 js에서는 가능함
        console.log("c:"+c);
        console.log("d:"+d);
        console.log(typeof(a));
        console.log(typeof(b));
        console.log(typeof(c));
        console.log(typeof(d));

    </script>
</head>
<body>
    
</body>
</html>
