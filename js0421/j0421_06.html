<body>
    <h2 id="bmi">BMI 계산하기</h2> <!--쿼리셀렉터 ( id ).innerText로 텍스트 할당-->

    <label>신장</label>
    <input type="text" name="height" id="height"> <!--쿼리셀렉터 ( id ).value로 입력값 할당-->
    <label>cm</label>
    <br>
    <label>체중</label>
    <input type="text" name="weight" id="weight">
    <label>kg</label>
    <br>
    <button onclick="calBtn()">계산하기</button>
    <div id="result">0</div>
    <div id="result2">정상</div>





    <script>
        function calBtn(){
            alert("계산하기 실행");
            //
            let height = Number(document.querySelector("#height").value);       // value에 값을 넣으려면 뒤에 = 으로 값 대입
            let weight = Number(document.querySelector("#weight").value);
            let hm = height / 100
            // console.log(document.querySelector("#bmi").innerText);    // innerText도 동일
            let BMI = weight / (hm*hm);
            document.querySelector("#result").innerText=BMI

            console.log(document.querySelector("#height").value);
            console.log(document.querySelector("#weight").value);
            console.log(document.querySelector("#result").innerText);

            if(BMI>=30){
                document.querySelector("#result2").innerText="고도비만"
            }else if(BMI>=25){
                document.querySelector("#result2").innerText="비만"
            }else if(BMI>23){
                document.querySelector("#result2").innerText="과체중"
            }else if(BMI>18.5){
                document.querySelector("#result2").innerText="정상"
            }else{
                document.querySelector("#result2").innerText="저체중"
            }

        }

        let weight = Number(prompt("체중(kg)을 입력하세요."));
        let height = Number(prompt("신장(cm)을 입력하세요."));

        let BMI = weight / (height_m*height_m);
        console.log("BMI 지수 :",BMI);
        console.log("체중 :",weight);
        console.log("키 :",height);
