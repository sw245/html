<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script  src="http://code.jquery.com/jquery-latest.min.js"></script>
    <title>DDDocument</title>
    <style>
        *{margin:0; padding: 0;}
        #container{width:1200px; margin:30px auto; text-align: center;}
        h2{font-size: 40px; margin-bottom:40px;}
        table{width:1200px; margin:0 auto;}
        table,th,td{border:1px solid black; border-collapse: collapse;}
        th{height: 60px; background: #eee;}
        td{height:50px;}
        button{width:100px; height:35px;}
        input:focus {
           outline: none; border:1px solid red;
        }
        input{margin-bottom:5px;}
        #input{margin-bottom: 30px;}
        #input div{font-size: 30px; margin-bottom: 10px;}
        #input input{width:500px; height:32px; padding-left: 20px;}
    </style>
    <script>
        // 1. 리스트 5개 출력
        // 2. save 버튼 클릭 시 게시글 추가 구현

        $(function(){
            let hdata = ``;
            let no = 1
            let suFlag = 0;
            let num_mod = 0;

            for(i=5;i>0;i--){
                hdata += `<tr id=${i}><td>${i}</td>`;
                hdata += `<td class="title">이벤트 신청</td>`;
                hdata += `<td>관리자</td>`;
                hdata += `<td>2025-04-24</td>`;
                hdata += `<td>1</td>`;
                hdata += `<td><button type="button" id="mod">수정</button>`;
                hdata += `<button type="button" id="del">삭제</button></td></tr>`;
                no++;
            }

            $("#tbody").html(hdata);
                
            /*
            $(document).on("focus","#name",function(key){

            })
            */

            
            $(document).on("click","#save",function(){
                if(suFlag == 0){
                    hdata = ``;
                    hdata += `<tr id=${no}><td>${no}</td>`;
                    hdata += `<td class="title">${$('#title').val()}</td>`;
                    hdata += `<td>${$("#name").val()}</td>`;
                    hdata += `<td>2025-04-24</td>`;
                    hdata += `<td>1</td>`;
                    hdata += `<td><button type="button" id="mod">수정</button>`;
                    hdata += `<button type="button" id="del">삭제</button></td></tr>`;
                    no++;
                    $("#tbody").prepend(hdata);
                }
                else if(suFlag == 1){
                    hdata = ``;
                    hdata += `<td>${num_mod}</td>`;
                    hdata += `<td class="title">${$('#title').val()}</td>`;
                    hdata += `<td>${$("#name").val()}</td>`;
                    hdata += `<td>2025-04-24</td>`;
                    hdata += `<td>1</td>`;
                    hdata += `<td><button type="button" id="mod">수정</button>`;
                    hdata += `<button type="button" id="del">삭제</button></td>`;

                    $(`#${num_mod}`).html(hdata);
                    $("#title").val("");
                    $("#name").val("");
                    $("#save").text("저장");
                    suFlag = 0;
                }

            })
                

            $(document).on("click","#del",function(){
                if(confirm("정말 삭제하시겠습니까?")){
                    $(`#${$(this).closest("tr").attr("id")}`).remove();
                }
            })
                
            // 게시글 수정
            $(document).on("click","#mod",function(){
                num_mod = $(this).closest("tr").attr("id");
                if(confirm(`${num_mod}번 항목을 수정하시겠습니까?`)){
                    title_mod = $(this).closest("tr").children()[1].innerText ;
                    name_mod = $(this).closest("tr").children()[2].innerText ;
                    $("#title").val(title_mod) ;
                    $("#name").val(name_mod) ;
                    $("#save").text("수정 저장");
                    suFlag = 1;
                }
            })
        });

    </script>
</head>
<body>
    <div id="container">
        <h2>게시판</h2>
        <div id="input">
            <div>글을 입력하세요.</div>
            <input type="text" name="title" id="title" placeholder="제목을 입력하세요.">
            <input type="text" name="title" id="name" placeholder="작성자를 입력하세요.">
            <button type="button" id="save">저장</button>
        </div>

        <table>
            <colgroup>
              <col width="10%">
              <col width="*">
              <col width="12%">
              <col width="12%">
              <col width="12%">
              <col width="20%">
            </colgroup>
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>작성일</th>
                <th>조회수</th>
                <th>기타</th>
            </tr>
            <tbody id="tbody">
                <tr id="1">
                    <td>1</td>
                    <td class="title">이벤트 신청</td>
                    <td>관리자</td>
                    <td>2025-04-24</td>
                    <td>1</td>
                    <td>
                        <button type="button" id="mod">수정</button>
                        <button type="button" id="del">삭제</button>
                    </td>
                </tr>
            </tbody>
        </table>

    </div>
</body>
</html>
